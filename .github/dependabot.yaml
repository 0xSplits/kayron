#
# This file is maintained by hand. It was originally generated via the
# "workflow" command line tool, but the tool's template cannot express the
# groups and cooldown below, so do not regenerate it.
#

version: 2

updates:
  - package-ecosystem: "docker"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      time: "04:00"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      time: "04:00"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      time: "04:00"
    # Wait for releases to settle before proposing them, so that point
    # releases superseded within days never reach the queue.
    cooldown:
      default-days: 3
      semver-major-days: 7
    # A dependency joins the first group whose pattern matches, so the named
    # groups must stay above the catch-all. Major bumps outside the named
    # groups remain individual pull requests.
    groups:
      aws-sdk-go-v2:
        patterns:
          - "github.com/aws/aws-sdk-go-v2"
          - "github.com/aws/aws-sdk-go-v2/*"
      golang-x:
        patterns:
          - "golang.org/x/*"
      splits:
        patterns:
          - "github.com/0xSplits/*"
          - "github.com/xh3b4sd/*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
